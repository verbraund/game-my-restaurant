</style></head><body><header><b>🍽️ Мій ресторан 0.30</b><div><button id="developBtn">🏗️ Розвиток</button> <button id="menuBtn">☰ Меню</button></div></header><div id="stats"></div><div id="tutorialBar" class="hidden"></div><div id="wrap"><canvas id="game" width="900" height="510"></canvas><div id="toast" class="hidden"></div></div><div id="message">Підійди до предмета або гостя й натисни «Дія». До дверей веде пішохідна доріжка.</div><div id="controls"><div id="pad"><span></span><button data-dir="up">▲</button><span></span><button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button></div><div id="actions"><button id="act">✋ Дія</button><button id="security">🛡️ Охорона</button></div></div><div id="overlay" class="overlay"><div class="panel" id="panel"></div></div><script>

const $=id=>document.getElementById(id),c=$('game'),ctx=c.getContext('2d');let touchTarget=null,touchPointer=null;let state,paused=true,modal=true,keys={},last=performance.now(),spawnClock=0,carClock=0,autos=[],toastUntil=0,toastText='';
const dishes={sushi:{name:'Суші',emoji:'🍣',price:19,time:8,need:{rice:1,fish:1}},hotdog:{name:'Хот-дог',emoji:'🌭',price:14,time:5,need:{bun:1,meat:1}},burger:{name:'Бургер',emoji:'🍔',price:17,time:6,need:{bun:1,meat:1,cheese:1}},fries:{name:'Фрі',emoji:'🍟',price:10,time:5,need:{potato:2}},coffee:{name:'Кава',emoji:'☕',price:7,time:3,need:{coffee:1}},juice:{name:'Сік',emoji:'🥤',price:6,time:2,need:{juice:1}},water:{name:'Вода',emoji:'💧',price:4,time:1,need:{water:1}},pizza:{name:'Піца',emoji:'🍕',price:20,time:9,need:{dough:1,cheese:2,meat:1}},lasagna:{name:'Лазанья',emoji:'🥘',price:23,time:11,need:{dough:1,meat:2,cheese:2}},pasta:{name:'Паста з креветками',emoji:'🍝',price:25,time:12,need:{pasta:1,shrimp:2}}};

function fresh(){let stock={};Object.keys(ingredients).forEach(k=>stock[k]=8);return {money:250,rep:4.5,stock,prices:Object.fromEntries(Object.entries(dishes).map(([k,v])=>[k,v.price])),p:{x:440,y:230},guests:[],tables:[],tasks:[],held:[],ready:[],waiter:null,cleaner:null,trays:0,spill:[],delivery:null,guard:null,day:1,served:0,missed:0,spawnDelay:4,visitorCount:0,tutorial:0,restaurantOpen:false,shirt:'blue',ownedShirts:['blue']};}
function save(){try{localStorage.setItem('restoran07',JSON.stringify(state))}catch(e){}}
function load(){try{let x=JSON.parse(localStorage.getItem('restoran07'));if(x&&x.stock&&x.tables&&x.prices){for(let [k,v] of Object.entries(dishes))if(x.prices[k]==null)x.prices[k]=v.price;for(let k of Object.keys(ingredients))if(x.stock[k]==null)x.stock[k]=8;if(!Array.isArray(x.held))x.held=[];if(!Array.isArray(x.ready))x.ready=[];if(Array.isArray(x.guests))x.guests.forEach(g=>{if(g.ordered==null)g.ordered=g.order.length>0});if(!x.waiter)x.waiter=null;if(!x.cleaner)x.cleaner=null;x.prices=Object.fromEntries(Object.entries(dishes).map(([k,v])=>[k,v.price]));if(!Number.isInteger(x.visitorCount))x.visitorCount=Math.max(0,(x.served||0)+(x.missed||0)+x.guests.length);if(!shirtColors[x.shirt])x.shirt='blue';if(!Array.isArray(x.ownedShirts))x.ownedShirts=['blue'];if(!x.ownedShirts.includes('blue'))x.ownedShirts.push('blue');if(Array.isArray(x.guests))x.guests.forEach(g=>{if(!g.gender)Object.assign(g,guestStyle())});if(x.tutorial==null)x.tutorial=-1;if(x.restaurantOpen==null)x.restaurantOpen=true;return x}}catch(e){}return fresh()}
function notify(t){$('message').textContent=t;toastText=t;toastUntil=performance.now()+2300}
function openPanel(html){modal=true;paused=true;$('overlay').classList.remove('hidden');$('panel').innerHTML=html}

function mainMenu(){openPanel('<h2>🍽️ Мій ресторан</h2><p>Керуй рестораном, цінами, закупівлями та обслуговуванням.</p><button id="continue">▶ Продовжити гру</button><button id="restart">↻ Почати спочатку</button><button id="exit">⏹ Вийти з гри</button><p class="muted">Прогрес зберігається у браузері цього пристрою.</p>');$('continue').onclick=()=>{closePanel();tutorialRefresh()};$('restart').onclick=()=>{openPanel('<h2>Почати заново?</h2><p>Увесь прогрес, гроші та запаси буде скинуто. Точно почати нову гру?</p><button id="yes">Так, почати заново</button><button id="no">Ні, повернутися</button>');$('yes').onclick=()=>{state=fresh();save();closePanel();tutorialRefresh()};$('no').onclick=mainMenu};$('exit').onclick=()=>{save();openPanel('<h2>Гру призупинено</h2><p>Прогрес збережено. Можна закрити вкладку браузера.</p><button id="back">Повернутися</button>');$('back').onclick=mainMenu}}
function development(){
if(state.tutorial===1)return tutorialBuyTable();
let n=state.tables.filter(t=>!t.double).length,cost=n===2?350:500;
openPanel('<h2>🏗️ Розвиток ресторану</h2><p>Баланс: $'+state.money.toFixed(0)+'</p><div class="line"><span>👔 Офіціант — $500<br><small>Приймає замовлення та подає страви</small></span><button id="hireWaiter" '+(state.waiter||state.money<500?'disabled':'')+'>'+(state.waiter?'Найнято':'Найняти')+'</button></div><div class="line"><span>🧹 Прибиральник — $400<br><small>Прибирає столики, сміття та миє посуд</small></span><button id="hireCleaner" '+(state.cleaner||state.money<400?'disabled':'')+'>'+(state.cleaner?'Найнято':'Найняти')+'</button></div><div class="line"><span>🪑 '+(n>=4?'Усі столики придбано':(n+1)+'-й столик — $'+cost)+'</span><button id="buyTable" '+(n>=4||state.money<cost?'disabled':'')+'>'+(n>=4?'Максимум':'Купити')+'</button></div><div class="line"><span>🪑 Подвійний столик — $600<br><small>Для двох відвідувачів одночасно</small></span><button id="buyDouble" '+(state.tables.some(t=>t.double)||state.money<600?'disabled':'')+'>'+(state.tables.some(t=>t.double)?'Придбано':'Купити')+'</button></div><div class="line"><span>👕 Одяг персонажа</span><button id="shirts">Магазин</button></div><button id="back">Повернутися до гри</button>');
$('back').onclick=()=>{closePanel();if(state.tutorial===9)tutorialAdvance(10)};$('shirts').onclick=shirtShop;$('buyDouble').onclick=()=>{if(state.tables.some(t=>t.double)||state.money<600)return;state.money-=600;state.tables.push({x:245,y:395,dirty:false,double:true});save();development()};
$('hireWaiter').onclick=()=>{if(state.waiter||state.money<500)return;state.money-=500;state.waiter={x:520,y:220,mode:'idle',target:null,carrying:null,delay:0};save();development()};
$('hireCleaner').onclick=()=>{if(state.cleaner||state.money<400)return;state.money-=400;state.cleaner={x:550,y:145,delay:0};save();development()};
$('buyTable').onclick=()=>{let n=state.tables.filter(t=>!t.double).length,cost=n===2?350:500;if(n>=4||state.money<cost)return;state.money-=cost;state.tables.push({x:390,y:n===2?165:285,dirty:false});save();development()};
}
function shirtShop(){let rows=Object.entries(shirtColors).map(([k,[name,color]])=>{let owned=state.ownedShirts.includes(k),active=state.shirt===k;return '<div class="line"><span><span style="display:inline-block;background:'+color+';width:20px;height:20px;border-radius:5px;vertical-align:middle;margin-right:8px"></span>'+name+' — '+(k==='blue'?'безкоштовно':'$50')+'</span><button data-shirt="'+k+'" '+(active||(!owned&&state.money<50)?'disabled':'')+'>'+(active?'Одягнено':owned?'Одягнути':'Купити')+'</button></div>'}).join('');openPanel('<h2>👕 Магазин футболок</h2><p>Баланс: $'+state.money.toFixed(0)+'</p>'+rows+'<button id="back">Назад до розвитку</button>');$('back').onclick=development;document.querySelectorAll('[data-shirt]').forEach(b=>b.onclick=()=>{let k=b.dataset.shirt;if(!shirtColors[k])return;if(!state.ownedShirts.includes(k)){if(state.money<50)return;state.money-=50;state.ownedShirts.push(k)}state.shirt=k;save();shirtShop()})}
function cleanerUpdate(dt){
let w=state.cleaner;if(!w)return;w.delay=Math.max(0,(w.delay||0)-dt);
let target=state.tables.find((t,i)=>t.dirty&&!state.guests.some(g=>g.table===i&&g.phase==='seated'));
let spill=state.spill[0],dest=target||spill||(state.trays?{x:555,y:80}:null);
if(!dest)return;
if(moveTo(w,dest,dt,115)&&w.delay<=0){
if(target){target.dirty=false;state.trays++;notify('🧹 Прибиральник очистив столик')}
else if(spill){state.spill.shift();notify('🧹 Прибиральник прибрав сміття')}
else{state.trays=0;notify('🧹 Прибиральник помив посуд')}
w.delay=1.5;save();
}}
function orderGuest(g){if(state.tutorial===3){g.order=['hotdog'];g.ordered=true;g.mood=100;g.wait=0;tutorialAdvance(4);save();return}let keys=Object.keys(dishes),count=(g.partySize===2?2:1)+Math.floor(Math.random()*(g.partySize===2?5:4));g.order=Array.from({length:count},()=>pick(keys));g.ordered=true;g.mood=95;g.wait=0;notify('Замовлення: '+g.order.map(k=>dishes[k].name).join(', ')+' — готуй на кухні');save()}
function waiterUpdate(dt){let w=state.waiter;if(!w)return;w.delay=Math.max(0,(w.delay||0)-dt);let guest=state.guests.find(g=>g.id===w.target&&g.phase==='seated');if(w.mode==='toGuest'&&guest){if(moveTo(w,{x:guest.x+70,y:guest.y+28},dt,105)){if(w.carrying){let k=w.carrying;w.carrying=null;if(guest.order.includes(k)){guest.order.splice(guest.order.indexOf(k),1);guest.total=(guest.total||0)+state.prices[k];notify('Офіціант подав: '+dishes[k].name);if(!guest.order.length){if(guest.trouble==='fraud'){finish(guest,false);notify('Гість не оплатив рахунок')}else finish(guest,true)}}}else if(!guest.ordered){orderGuest(guest)}w.mode='idle';w.target=null;w.delay=1.2}return}if(w.mode==='toGuest'&&!guest){if(w.carrying)state.ready.push(w.carrying);w.carrying=null;w.mode='idle';w.target=null}if(w.mode==='toKitchen'){if(moveTo(w,{x:660,y:265},dt,105)){let g=state.guests.find(g=>g.id===w.target&&g.phase==='seated');let index=g?state.ready.findIndex(k=>g.order.includes(k)):-1;if(index>=0){w.carrying=state.ready.splice(index,1)[0];w.mode='toGuest'}else{w.mode='idle';w.target=null}w.delay=.6}return}if(w.delay>0)return;let order=state.guests.find(g=>g.phase==='seated'&&!g.ordered&&!(g.trouble==='fight'&&g.wait>9));if(order){w.target=order.id;w.mode='toGuest';return}let serve=state.guests.find(g=>g.phase==='seated'&&g.ordered&&!(g.trouble==='fight'&&g.wait>9)&&state.ready.some(k=>g.order.includes(k)));if(serve){w.target=serve.id;w.mode='toKitchen'}}
function stats(){let st=Object.entries(state.stock).map(([k,v])=>ingredients[k][0]+': '+v).join(' · ');$('stats').textContent=`💵 $${state.money.toFixed(0)}   ⭐ ${state.rep.toFixed(1)}/5   🍽️ Обслужено: ${state.served}   👔 ${state.waiter?'Офіціант':'—'}   🧹 ${state.cleaner?'Прибиральник':'—'}   🪑 ${state.tables.length}   📦 ${st}`}
function distance(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function nearest(){let p=state.p,all=[];for(let [k,xy] of Object.entries(spots))all.push({kind:k,x:xy[0],y:xy[1]});state.guests.forEach(g=>{if(g.phase==='seated'||g.phase==='leaving')all.push({kind:'guest',x:g.x,y:g.y,g})});state.tables.forEach((t,i)=>{if(t.dirty)all.push({kind:'table',x:t.x,y:t.y,i})});state.spill.forEach((v,i)=>all.push({kind:'spill',x:v.x,y:v.y,i}));all.sort((a,b)=>distance(p,a)-distance(p,b));return all[0]&&distance(p,all[0])<90?all[0]:null}
function act(){if(modal)return;let n=nearest();if(!n)return notify('Підійди ближче до потрібного предмета');if(n.kind==='computer')return shop();if(n.kind==='kitchen')return kitchen();if(n.kind==='sink'){if(state.trays){state.trays=0;notify('Посуд помито, мийка чиста');save()}else notify('Немає брудного посуду');return}if(n.kind==='bin'){return trashMenu()}if(n.kind==='delivery'){if(state.delivery&&state.delivery.arrived){for(let [k,v] of Object.entries(state.delivery.items))state.stock[k]+=v;state.delivery=null;notify('Продукти отримано та покладено на склад');save()}else notify('Доставки поки немає');return}if(n.kind==='table'){state.tables[n.i].dirty=false;state.trays++;notify('Піднос узято. Віднеси його до мийки');if(state.tutorial===8)tutorialAdvance(9);save();return}if(n.kind==='spill'){state.spill.splice(n.i,1);notify('Підлогу прибрано');save();return}if(n.kind==='guest')return guestAction(n.g);notify('Двері відчиняються автоматично')}
function trashMenu(){if(!state.held.length){if(state.spill.length){state.spill.pop();notify('Сміття викинуто');save()}else notify('Немає їжі в руках');return}let rows=state.held.map((k,i)=>'<div class="line"><span>'+dishes[k].emoji+' '+dishes[k].name+'</span><button data-discard="'+i+'">Викинути</button></div>').join('');openPanel('<h2>🗑️ Смітник</h2><p>Вибери страву, яку потрібно викинути.</p>'+rows+'<button id="close">Назад</button>');$('close').onclick=closePanel;document.querySelectorAll('[data-discard]').forEach(b=>b.onclick=()=>{let i=Number(b.dataset.discard);if(i<0||i>=state.held.length)return;let k=state.held.splice(i,1)[0];save();closePanel();notify('Викинуто: '+dishes[k].name)})}
function guestAction(g){if(state.tutorial===2)return notify('Зачекай, поки гість сяде за столик');if(g.phase!=='seated')return notify('Гість виходить');if(g.trouble==='fight'&&g.wait>9){return notify('Конфлікт! Натисни «Охорона»')}if(!g.ordered){orderGuest(g);return}let idx=state.held.findIndex(k=>g.order.includes(k));if(idx>=0){let k=state.held.splice(idx,1)[0];g.order.splice(g.order.indexOf(k),1);g.total=(g.total||0)+state.prices[k];notify('Подано: '+dishes[k].name+'. Залишилось '+g.order.length);if(!g.order.length){if(state.tutorial===7)tutorialAdvance(8);if(g.trouble==='fraud'){openPanel('<h2>💳 Проблема з оплатою</h2><p>Гість каже, що забув гаманець. Як вчинити?</p><button id="transfer">Попросити переказ</button><button id="guardPay">Викликати охорону</button><button id="later">Дозволити оплатити пізніше</button>');$('transfer').onclick=()=>{let paid=Math.random()<.6;finish(g,paid);closePanel();notify(paid?'Оплата переказом пройшла':'Гість не зміг оплатити')};$('guardPay').onclick=()=>{closePanel();callGuard(g)};$('later').onclick=()=>{finish(g,false);closePanel();notify('Гість пообіцяв повернути гроші')}}else finish(g,true)}save();return}notify('Потрібно приготувати: '+g.order.map(k=>dishes[k].name).join(', '))}

    if(!musicTimer)musicTimer=setInterval(musicSchedule,90);
  }catch(e){}
}
function stopMusic(){if(musicTimer){clearInterval(musicTimer);musicTimer=null}if(musicCtx&&musicCtx.state==='running')musicCtx.suspend()}
